<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление...</title>
</head>
<body style="background-color: #000000; margin: 0;">

    <script>
        // Анонимная асинхронная функция, которая запускается сама сразу при загрузке
        (async function() {
            try {
                // Стучимся в твой скрытый файл на сервере
                const response = await fetch('/.netlify/functions/get_bot');
                
                if (!response.ok) throw new Error('Ошибка соединения');
                
                const data = await response.json();

                if (data.url) {
                    // Используем replace, чтобы пустая страница не оставалась в истории браузера
                    window.location.replace(data.url); 
                }
            } catch (error) {
                console.error("Не удалось получить ссылку на бота:", error);
            }
        })();
    </script>
</body>
</html>
